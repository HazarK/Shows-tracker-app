[project]
name = "tvtracker"
version = "0.1.0"
description = "Telegram bot that alerts you when a tracked TV show gets a new season."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.6,<22",
    "httpx>=0.27",
    "APScheduler>=3.10.4,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tvtracker = "tvtracker.main:main"
tvtracker-check = "tvtracker.jobs.check_seasons:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvtracker = ["db/schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
